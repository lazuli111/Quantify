# 回调观察台：放进 nginx 的 server { } 里（东京服务器上是 /etc/nginx/sites-available/portal-hub），
# 网址 http://<服务器>/quantify/。文件由 deploy/daily.sh 每次更新后从 docs/ 复制到 /var/www/quantify。
location = /quantify {
    return 301 /quantify/;
}

location /quantify/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    # 数据每天更新，让浏览器每次都确认一下
    add_header Cache-Control "no-cache" always;
    # location 里写了 add_header 就不再继承 server 里的，所以安全响应头要在这里再写一遍
    include snippets/security-headers.conf;
    # 只允许本站脚本和 Google 字体（页面里的样式和脚本是内联的）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
}
