[project]
name = "quantify"
version = "0.1.0"
description = "美股日内交易信号工具（纳斯达克 100）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.106",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "yfinance>=1.7.0",
]

[project.scripts]
quantify = "quantify.cli:main"

[project.optional-dependencies]
ai = [
    "tradingagents",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
tradingagents = { git = "https://github.com/lazuli111/TradingAgents", rev = "e61f89df2e7de10fcd0576da3f5ca72bae065416" }  # v0.6.0 + Claude subscription provider + Yahoo news fix
