name: 每日模拟交易更新

# 美股收盘后运行。Yahoo 对部分股票的当天日线要到美东晚上 9–10 点半才给出，所以：
# 03:30 UTC（美东夏令时 23:30 / 冬令时 22:30）第一次运行；数据还不全就安静结束，不报错。
# 06:30 UTC 再跑一次作为备用：第一次已成功时它发现没有新交易日，什么都不做；否则由它补上，
# 这次仍然不全才算失败并提醒。
on:
  schedule:
    - cron: "30 3 * * 2-6"
    - cron: "30 6 * * 2-6"
  workflow_dispatch:
    inputs:
      notify:
        description: "发送 Telegram 推送"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: 安装依赖
        run: uv sync --frozen --extra ai

      - name: 更新模拟账户
        id: paper
        run: uv run quantify paper ${{ github.event.schedule == '30 3 * * 2-6' && '--soft-incomplete' || '' }}

      - name: 安装 Claude Code（用 Claude 订阅做 AI 第二意见）
        if: steps.paper.outputs.skip != 'true'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      # 先用 Claude 订阅（CLAUDE_CODE_OAUTH_TOKEN，由 claude setup-token 生成）；
      # 没有设置，或某只股票 Claude 分析失败时，改用 DeepSeek。
      - name: AI 第二意见（只记录，不影响模拟交易）
        if: steps.paper.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run quantify ai

      - name: 保存记录到仓库
        if: steps.paper.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper docs
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "每日模拟更新 $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.paper.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.paper.outputs.skip != 'true'
        with:
          path: docs

      - id: deploy
        if: steps.paper.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 发送 Telegram 推送
        if: steps.paper.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.notify)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 定时运行只在出现新交易日时推送；手动运行（勾选推送）总是推送
        run: uv run quantify notify ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: 更新失败时推送提醒
        # 第一次定时运行失败时先不提醒，等备用运行；备用运行或手动运行失败才提醒
        if: failure() && (github.event_name != 'schedule' || github.event.schedule == '30 6 * * 2-6')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run quantify notify --failed "已自动重试仍然失败。运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
